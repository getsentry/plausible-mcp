name: CI

# release/** is included because craft gates publishing on the release commit's CI status.
on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: typecheck, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # pnpm@11 (pinned via package.json packageManager) requires Node >= 22.13.
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm build

      - run: pnpm test

      - name: Exercise the built MCP Apps resource and review scenarios
        run: node evals/ui-review.mjs

      - run: pnpm exec playwright install --with-deps chromium --only-shell

      - run: pnpm exec playwright test --config evals/playwright.config.mjs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-apps-preview
          path: coverage/ui-review/index.html
