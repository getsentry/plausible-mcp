# esbuild (tsx + vitest), @sentry/cli, and Wrangler's workerd runtime need
# post-install scripts to fetch platform binaries; pnpm blocks them by default.
onlyBuiltDependencies:
  - "@sentry/cli"
  - esbuild
  - workerd
allowBuilds:
  "@sentry/cli": true
  esbuild: true
  core-js-pure: false
  workerd: true

# Force esbuild (transitive via tsx + vitest) to the patched 0.28.1 — earlier
# versions have a high-severity advisory (GHSA-gv7w-rqvm-qjhr).
overrides:
  esbuild: ">=0.28.1"
  # No patched 1.x exists for the @hono/node-server serve-static advisory and the
  # MCP SDK pins ^1.x. None of our transports load the Node server (the Worker uses
  # the web-standard transport, STDIO uses stdio), so the 2.x jump is inert here.
  "@hono/node-server": "^2.0.5"
  # Miniflare (via Wrangler) pins undici 7.29.x, which has a high-severity advisory
  # (GHSA-xjj6-f33q-929c) fixed in 7.30.1. Dev-only: the Worker bundle does not ship undici.
  "undici@>=7 <7.30.1": "^7.30.1"
